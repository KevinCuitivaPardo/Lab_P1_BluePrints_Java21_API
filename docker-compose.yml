services:
  db:
    image: postgres:16-alpine
    container_name: blueprints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blueprints
      POSTGRES_PASSWORD: blueprints
      POSTGRES_DB: blueprints_db
    ports:
      - "5432:5432"
    volumes:
      - blueprints_pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprints -d blueprints_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  blueprints_pg_data:
